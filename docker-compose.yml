version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: inventi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventi123}
      POSTGRES_DB: ${POSTGRES_DB:-inventi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventati}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: inventi_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventi}:${POSTGRES_PASSWORD:-inventi123}@db:5432/${POSTGRES_DB:-inventi}
      API_KEY: ${API_KEY:-dev-api-key-troque-em-producao}
    volumes:
      - .:/app
    ports:
      - "8000:8000"

volumes:
  postgres_data: